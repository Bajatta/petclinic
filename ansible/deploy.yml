---
- name: Deploy PetClinic container to the discovered hosts
  hosts: webservers
  become: true
  serial: 1
  vars:
    app_name: petclinic
    app_image: "{{ nexus_repo }}/petclinicapps"

  tasks:
    - name: Install the New Relic infrastructure agent
      shell: |
        curl -fsSL -o /etc/yum.repos.d/newrelic-infra.repo https://download.newrelic.com/infrastructure_agent/linux/yum/el/9/x86_64/newrelic-infra.repo
        dnf install -y newrelic-infra
        printf 'license_key: %s\ndisplay_name: %s\n' '{{ newrelic_key }}' '{{ inventory_hostname }}' > /etc/newrelic-infra.yml
        systemctl enable --now newrelic-infra
      args:
        creates: /etc/newrelic-infra.yml
      when: newrelic_key is defined and newrelic_key | length > 0
      no_log: true
      ignore_errors: true

    - name: Trust the HTTP Nexus Docker registry
      copy:
        dest: /etc/docker/daemon.json
        content: |
          { "insecure-registries": ["{{ nexus_repo }}"] }
      register: daemon_json

    - name: Restart Docker if the registry config changed
      service:
        name: docker
        state: restarted
      when: daemon_json.changed

    - name: Log in to the Nexus Docker registry
      command: docker login -u {{ nexus_user }} -p {{ nexus_password }} {{ nexus_repo }}
      no_log: true

    - name: Pull the latest image
      command: docker pull {{ app_image }}:latest

    - name: Remove the old container if it exists
      shell: docker rm -f {{ app_name }} || true
      changed_when: false

    - name: Start the new container
      command: >
        docker run -d --name {{ app_name }}
        --restart unless-stopped
        -p 8080:8080
        {{ app_image }}:latest

    - name: Wait for the application to listen on 8080
      wait_for:
        port: 8080
        delay: 10
        timeout: 180
